version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      nuget: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /src/web
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: terraform
    directories: [/deploy/terraform, /deploy/terraform/modules/mbr]
    schedule: { interval: weekly }
