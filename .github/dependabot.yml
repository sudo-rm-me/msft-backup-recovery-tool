version: 2
updates:
  - package-ecosystem: nuget
    directories: [/, /tests/Mbr.LiveTests]
    schedule: { interval: weekly }
    groups:
      nuget: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /src/web
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # .NET major upgrades change the SDK, runtime and TargetFramework together; done deliberately.
      - dependency-name: dotnet/sdk
        update-types: [version-update:semver-major]
      - dependency-name: dotnet/aspnet
        update-types: [version-update:semver-major]

  - package-ecosystem: terraform
    directories: [/deploy/terraform, /deploy/terraform/modules/mbr]
    schedule: { interval: weekly }
    ignore:
      # Provider major versions have breaking changes; upgraded deliberately.
      - dependency-name: hashicorp/*
        update-types: [version-update:semver-major]
