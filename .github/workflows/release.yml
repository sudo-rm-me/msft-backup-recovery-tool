# Publishes the image for a version tag (v1.2.3) to GitHub Container Registry and creates the GitHub release.
# Deploy it with the module's `image` input: ghcr.io/sudo-rm-me/msft-backup-recovery-tool:1.2.3

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write      # signing the build provenance (Sigstore, keyless)
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A signed statement of which commit and workflow built the image, stored next to it in the registry.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}\`

          Deploy it with the Terraform module's \`image\` input (docs/setup.md, \"Where the image comes from\").

          Verify it was built here: \`gh attestation verify oci://ghcr.io/${GITHUB_REPOSITORY}:${TAG#v} --owner ${GITHUB_REPOSITORY_OWNER}\`"
