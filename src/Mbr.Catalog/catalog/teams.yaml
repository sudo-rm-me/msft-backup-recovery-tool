# Microsoft Teams: team settings and channels through Graph; tenant policies through the MicrosoftTeams module.

- type: teams.team
  workload: teams
  displayName: Teams (settings and channels)
  listPath: teams
  getItem: true
  dependsOn: [entra.group]
  children:
    - name: channels
      path: teams/{id}/channels
      strip: [id, webUrl, createdDateTime, email, tenantId, isArchived, filesFolderWebUrl, isFavoriteByDefault]
      restore: { mode: add, keys: [displayName] }
  restore:
    updateOnly: true
    readOnly: [webUrl, internalId, createdDateTime, isArchived, tenantId, summary, specialization, visibility, isMembershipLimitedToOwners, classification]
    notes: A team is restored with its group; restoring the group from the recycle bin brings its team back.

- type: teams.appSettings
  workload: teams
  displayName: Teams app settings
  version: beta
  listPath: teamwork/teamsAppSettings
  singleton: true
  restore: { updateOnly: true }

- type: teams.meetingPolicy
